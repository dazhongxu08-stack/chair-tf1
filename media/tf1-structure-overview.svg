<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720">
  <title>TF-1 structure overview</title>
  <defs>
    <style type="text/css">
      @font-face{font-family:"Noto Sans CJK SC";src:url("file:///usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc");}
      .bg { fill: #f6f7f5; }
      .box { fill: #fff; stroke: #333; stroke-width: 1.6; rx: 6; }
      .motor { fill: #e8f0fa; stroke: #1a3a5c; stroke-width: 1.6; }
      .mech { fill: #eef5e8; stroke: #2a4a2a; stroke-width: 1.6; }
      .pass { fill: #faf6ef; stroke: #6a5530; stroke-width: 1.6; }
      .h { font: 600 18px "Noto Sans CJK SC", sans-serif; fill: #111; }
      .t { font: 13px "Noto Sans CJK SC", sans-serif; fill: #222; }
      .s { font: 11px "Noto Sans CJK SC", sans-serif; fill: #555; }
      .arr { stroke: #444; stroke-width: 1.4; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="720"/>
  <text class="h" x="28" y="36">合脊 TF-1 · 修改后结构总图（概念）</text>
  <text class="s" x="28" y="58">扶手 4D 纯机械 · 上背左右分块各 3DOF · 腰靠 Track/Stretch 互斥 · 单位 mm · 非 CAD</text>

  <!-- Chassis -->
  <rect class="box" x="360" y="90" width="260" height="56"/>
  <text class="t" x="420" y="115">底座 / 气杆座高 450–550</text>
  <text class="s" x="430" y="133">脚轮 ≥Ø76 · 倾仰枢轴 O</text>

  <path class="arr" d="M490 146 V170"/>
  <rect class="box" x="340" y="170" width="300" height="50"/>
  <text class="t" x="400" y="200">倾仰机构 90° / 100° / 130° / 160°</text>

  <path class="arr" d="M490 220 V245"/>
  <rect class="box" x="300" y="245" width="380" height="50"/>
  <text class="t" x="380" y="275">靠背框 500×570 · 框升 ↑50</text>

  <!-- branches -->
  <path class="arr" d="M380 295 V320"/>
  <path class="arr" d="M490 295 V320"/>
  <path class="arr" d="M600 295 V320"/>
  <path class="arr" d="M200 270 H300"/>
  <path class="arr" d="M780 270 H680"/>

  <!-- Headrest -->
  <rect class="pass" x="40" y="320" width="200" height="78"/>
  <text class="t" x="70" y="348">头枕 360×200</text>
  <text class="s" x="55" y="368">↑80 · 外翻45° · 内翻90°</text>
  <text class="s" x="55" y="386">前后行程 TBD</text>

  <!-- Upper L -->
  <rect class="mech" x="260" y="320" width="180" height="100"/>
  <text class="t" x="290" y="348">上背左（分块）</text>
  <text class="s" x="275" y="368">3DOF：↑50 / AP50 / ±15°</text>
  <text class="s" x="275" y="386">弹性+阻尼优先</text>
  <text class="s" x="275" y="404">不默认电机</text>

  <!-- Upper R -->
  <rect class="mech" x="460" y="320" width="180" height="100"/>
  <text class="t" x="490" y="348">上背右（分块）</text>
  <text class="s" x="475" y="368">3DOF：↑50 / AP50 / ±15°</text>
  <text class="s" x="475" y="386">与左独立扭身</text>
  <text class="s" x="475" y="404">Stretch 时锁定</text>

  <!-- Lumbar -->
  <rect class="motor" x="660" y="320" width="280" height="100"/>
  <text class="t" x="720" y="348">腰靠滑架 480×240</text>
  <text class="s" x="680" y="368">↑50 / AP50 / ±15° · 传感追腰</text>
  <text class="s" x="680" y="386">Track 与 Stretch 复用 AP</text>
  <text class="s" x="680" y="404">与 Track 互斥 · 电机驱动</text>

  <!-- Arms -->
  <rect class="mech" x="140" y="460" width="320" height="90"/>
  <text class="t" x="200" y="490">扶手 · 4D 纯机械手动</text>
  <text class="s" x="160" y="512">升降 70 · 前后 40 · 宽度侧摆 · 旋转</text>
  <text class="s" x="160" y="532">无电机、不自动 · 不做 7D · 臂侧按键控腰/拉伸</text>

  <!-- Seat -->
  <rect class="pass" x="500" y="460" width="320" height="90"/>
  <text class="t" x="580" y="490">坐垫</text>
  <text class="s" x="520" y="512">前后 40 · 微摆 ±6°</text>
  <text class="s" x="520" y="532">与倾仰联动（概念）</text>

  <text class="s" x="28" y="600">图例：绿色=机械/弹性包络 · 蓝色=电机化腰靠 · 米色=被动/手动调节</text>
  <text class="s" x="28" y="622">相对旧稿变更：砍 7D/电动扶手 → 4D 纯机械；上背整板 → 左右分块各 3DOF。</text>
  <text class="s" x="28" y="644">配套图：图1 侧视 · 图2 腰滑架 · 图3 倾仰 · 图4 背系正视（见同目录预览页）</text>
  <text class="s" x="28" y="680">合脊 TF-1 · 2026-09-23 · 概念示意非装配图</text>
</svg>
