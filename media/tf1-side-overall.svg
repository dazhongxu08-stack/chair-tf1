<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660">
  <title>TF-1 side</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <style>
      .frame { fill: none; stroke: #1a1a1a; stroke-width: 2.2; }
      .module { fill: #f2f2f2; stroke: #1a1a1a; stroke-width: 1.6; }
      .lumbar { fill: #e8eef5; stroke: #1a3a5c; stroke-width: 1.8; }
      .upper { fill: #eef5e8; stroke: #2a4a2a; stroke-width: 1.6; }
      .seat { fill: #f5f0e8; stroke: #5a4a2a; stroke-width: 1.8; }
      .dim { stroke: #444; stroke-width: 1; fill: none; }
      .dimt { font: 13px sans-serif; fill: #222; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
      .label { font: 14px sans-serif; fill: #111; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
      .note { font: 12px sans-serif; fill: #555; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
      .ground { stroke: #888; stroke-width: 1.5; }
      .axis { stroke: #888; stroke-dasharray: 4 3; stroke-width: 1; }
      .title { font: 600 17px sans-serif; fill: #111; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    </style>
  </defs>
  <text class="title" x="40" y="32">图1  合脊 TF-1 侧视总成机构简图（单位 mm）</text>
  <text class="note" x="40" y="52">示意比例，非 CAD 装配图 · 初始位 · 倾仰 90°</text>

  <line class="ground" x1="40" y1="590" x2="700" y2="590"/>
  <text class="note" x="40" y="610">地面</text>

  <circle class="frame" cx="220" cy="570" r="20"/>
  <circle class="frame" cx="380" cy="570" r="20"/>
  <text class="dimt" x="175" y="555">脚轮 ≥Ø76（3英寸）</text>
  <line class="frame" x1="220" y1="550" x2="380" y2="550"/>
  <line class="frame" x1="300" y1="550" x2="300" y2="490"/>

  <rect class="module" x="288" y="430" width="24" height="60"/>
  <text class="label" x="320" y="462">气杆</text>

  <line class="dim" x1="80" y1="590" x2="80" y2="410"/>
  <line class="dim" x1="74" y1="590" x2="86" y2="590"/>
  <line class="dim" x1="74" y1="410" x2="86" y2="410"/>
  <text class="dimt" x="18" y="510" transform="rotate(-90 18 510)">座高 450–550</text>

  <rect class="seat" x="160" y="410" width="280" height="28" rx="4"/>
  <text class="label" x="265" y="430">坐垫</text>
  <line class="dim" x1="160" y1="400" x2="200" y2="400" marker-end="url(#arrow)"/>
  <text class="dimt" x="205" y="404">前后 40</text>
  <path class="axis" d="M300 424 Q320 410 340 424"/>
  <text class="dimt" x="345" y="418">微摆 ±6°</text>

  <line class="dim" x1="440" y1="410" x2="440" y2="380"/>
  <text class="dimt" x="448" y="400">间隙 ≈30</text>

  <rect class="lumbar" x="430" y="290" width="36" height="90" rx="3"/>
  <text class="label" x="478" y="325">腰靠</text>
  <text class="dimt" x="478" y="345">480×240</text>
  <text class="dimt" x="478" y="363">↑50 · AP50 · ±15°</text>
  <line class="dim" x1="430" y1="280" x2="390" y2="280" marker-end="url(#arrow)"/>
  <line class="dim" x1="430" y1="280" x2="466" y2="280"/>
  <text class="dimt" x="395" y="272">AP 50</text>
  <line class="dim" x1="488" y1="290" x2="488" y2="340"/>
  <line class="dim" x1="482" y1="290" x2="494" y2="290"/>
  <line class="dim" x1="482" y1="340" x2="494" y2="340"/>
  <text class="dimt" x="500" y="320">↑50</text>

  <rect class="upper" x="438" y="130" width="32" height="140" rx="3"/>
  <text class="label" x="480" y="185">上背</text>
  <text class="dimt" x="480" y="205">500×340</text>
  <text class="dimt" x="480" y="223">↑50 · AP50 · ±15°</text>
  <line class="dim" x1="438" y1="120" x2="400" y2="120" marker-end="url(#arrow)"/>
  <text class="dimt" x="405" y="114">AP 50</text>

  <rect class="frame" x="466" y="110" width="18" height="270" stroke-dasharray="6 4"/>
  <text class="dimt" x="500" y="250">靠背框</text>
  <text class="dimt" x="500" y="268">500×570 · ↑50</text>
  <line class="dim" x1="640" y1="110" x2="640" y2="380"/>
  <line class="dim" x1="634" y1="110" x2="646" y2="110"/>
  <line class="dim" x1="634" y1="380" x2="646" y2="380"/>
  <text class="dimt" x="652" y="250">框高 570</text>

  <rect class="module" x="420" y="50" width="50" height="40" rx="4"/>
  <text class="label" x="480" y="65">头枕 360×200</text>
  <text class="dimt" x="480" y="83">↑80 · 外翻 45° · 内翻 90°</text>
  <text class="dimt" x="480" y="101">前后行程 = TBD（源文乱码）</text>
  <line class="dim" x1="445" y1="50" x2="445" y2="30"/>
  <text class="dimt" x="400" y="40">↑80</text>

  <line class="dim" x1="160" y1="450" x2="466" y2="450"/>
  <line class="dim" x1="160" y1="444" x2="160" y2="456"/>
  <line class="dim" x1="466" y1="444" x2="466" y2="456"/>
  <text class="dimt" x="230" y="472">初始外缘距（腰靠↔坐垫）≈420</text>

  <circle cx="456" cy="410" r="5" fill="#1a1a1a"/>
  <text class="dimt" x="360" y="505">倾仰枢轴 O</text>
  <text class="note" x="360" y="525">档位 90° / 100° / 130° / 160°</text>
</svg>
