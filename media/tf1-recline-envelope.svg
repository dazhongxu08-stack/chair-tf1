<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540">
  <title>TF-1 recline</title>
  <style>
    .f { fill: none; stroke: #1a1a1a; stroke-width: 2; }
    .seat { fill: #f5f0e8; stroke: #5a4a2a; stroke-width: 1.5; }
    .back { fill: none; stroke: #1a3a5c; stroke-width: 2; }
    .dash { fill: none; stroke: #888; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .t { font: 13px sans-serif; fill: #222; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    .h { font: 600 16px sans-serif; fill: #111; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    .n { font: 12px sans-serif; fill: #555; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
  </style>
  <text class="h" x="24" y="30">图3  倾仰档位与上背 / 腰–坐包络</text>
  <text class="n" x="24" y="52">角定义：座面水平时，靠背与座面夹角（上传档位）</text>

  <circle cx="280" cy="330" r="6" fill="#111"/>
  <text class="t" x="245" y="362">O 倾仰枢轴</text>
  <rect class="seat" x="120" y="318" width="160" height="22" rx="3"/>
  <text class="t" x="170" y="310">坐垫</text>

  <line class="back" x1="280" y1="330" x2="280" y2="110"/>
  <text class="t" x="288" y="150">90°</text>
  <line class="dash" x1="280" y1="330" x2="318" y2="115"/>
  <text class="t" x="325" y="140">100°</text>
  <line class="dash" x1="280" y1="330" x2="420" y2="170"/>
  <text class="t" x="430" y="180">130°</text>
  <text class="n" x="430" y="198">Track 降增益</text>
  <line class="back" x1="280" y1="330" x2="500" y2="260" stroke="#8a3030"/>
  <text class="t" x="510" y="265" fill="#8a3030">160°</text>
  <text class="n" x="510" y="285">Track 持位 · 禁止 Stretch</text>
  <path class="f" d="M280 170 A160 160 0 0 1 450 290" stroke-dasharray="3 3" opacity="0.5"/>

  <rect x="40" y="400" width="360" height="115" rx="6" fill="#f7f7f7" stroke="#ccc"/>
  <text class="t" x="55" y="425">上背模块包络（相对靠背框）</text>
  <text class="n" x="55" y="448">外形 500 × 340</text>
  <text class="n" x="55" y="468">升降 50 · 前后 AP 50 · 节距 ±15°</text>
  <text class="n" x="55" y="488">MVP：弹性扭杆 + 阻尼 + 硬限位</text>
  <text class="n" x="55" y="508">Pro：小电机追背；Stretch 时锁定</text>

  <rect x="420" y="400" width="400" height="115" rx="6" fill="#f0f4f8" stroke="#ccc"/>
  <text class="t" x="435" y="425">腰靠相对坐垫几何（初始）</text>
  <text class="n" x="435" y="448">外缘距 ≈ 420（腰靠最外 ↔ 坐垫最外）</text>
  <text class="n" x="435" y="468">坐垫–腰靠间隙 ≈ 30</text>
  <text class="n" x="435" y="488">坐垫前后滑 40；微摆 ±6°</text>
  <text class="n" x="435" y="508">座高（座面离地）450–550</text>
</svg>
