<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <title>TF-1 back dual</title>
  <defs>
    <style type="text/css">
      @font-face{font-family:"Noto Sans CJK SC";src:url("file:///usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc");}
      .frame { fill: none; stroke: #333; stroke-width: 2.5; }
      .upper { fill: #eef5e8; stroke: #2a4a2a; stroke-width: 1.6; }
      .lumb { fill: #e8eef5; stroke: #1a3a5c; stroke-width: 1.8; }
      .t { font: 13px "Noto Sans CJK SC", sans-serif; fill: #222; }
      .h { font: 600 16px "Noto Sans CJK SC", sans-serif; fill: #111; }
      .n { font: 12px "Noto Sans CJK SC", sans-serif; fill: #555; }
      .d { stroke: #444; stroke-width: 1; fill: none; }
    </style>
  </defs>
  <text class="h" x="24" y="30">图4  背系正视 — 上背左右分块（每块 3DOF）</text>
  <text class="n" x="24" y="52">外包络 500×340 · 每块 ↑50 / AP50 / ±15° · 扶手 4D 纯机械</text>

  <rect class="frame" x="180" y="80" width="250" height="285"/>
  <text class="t" x="450" y="100">靠背框 500×570 · ↑50</text>

  <rect class="upper" x="188" y="90" width="112" height="160" rx="4"/>
  <rect class="upper" x="310" y="90" width="112" height="160" rx="4"/>
  <text class="t" x="205" y="155">上背左</text>
  <text class="n" x="200" y="175">3DOF</text>
  <text class="n" x="195" y="193">↑50 AP50 ±15°</text>
  <text class="t" x="328" y="155">上背右</text>
  <text class="n" x="323" y="175">3DOF</text>
  <text class="n" x="318" y="193">↑50 AP50 ±15°</text>
  <text class="n" x="285" y="130">中缝</text>

  <line class="d" x1="180" y1="380" x2="430" y2="380"/>
  <text class="t" x="290" y="400">500</text>

  <rect class="lumb" x="190" y="270" width="230" height="85" rx="4"/>
  <text class="t" x="245" y="308">腰靠滑架 480×240</text>
  <text class="n" x="210" y="328">独立 ↑50 / AP50 / ±15° · 传感</text>

  <text class="n" x="180" y="440">解耦：左右上背独立 3DOF 包络（弹性优先）；腰靠分轨；Stretch 时锁左右上背。</text>
  <text class="n" x="180" y="462">扶手：4D 纯机械手动（升降/前后/宽度侧摆/旋转）— 无电机、不自动。</text>
</svg>
