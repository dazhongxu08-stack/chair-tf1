<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640">
  <title>TF-1 side structure updated</title>
  <defs>
    <style type="text/css">
      @font-face{font-family:"Noto Sans CJK SC";src:url("file:///usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc");}
      .h { font: 600 17px "Noto Sans CJK SC", sans-serif; fill: #111; }
      .t { font: 13px "Noto Sans CJK SC", sans-serif; fill: #222; }
      .n { font: 12px "Noto Sans CJK SC", sans-serif; fill: #555; }
      .seat { fill: #e8e4dc; stroke: #444; stroke-width: 1.5; }
      .back { fill: none; stroke: #333; stroke-width: 2.2; }
      .upper { fill: #eef5e8; stroke: #2a4a2a; stroke-width: 1.5; }
      .lumb { fill: #e8eef5; stroke: #1a3a5c; stroke-width: 1.6; }
      .arm { fill: #dfe8d8; stroke: #2a4a2a; stroke-width: 1.4; }
      .base { fill: #ddd; stroke: #333; stroke-width: 1.5; }
      .dim { stroke: #666; stroke-width: 1; fill: none; }
    </style>
  </defs>
  <text class="h" x="28" y="32">图1′  侧视结构（修改后口径）</text>
  <text class="n" x="28" y="52">头枕 TBD 前后 · 上背左右各 3DOF（侧视重叠示意） · 扶手 4D 纯机械 · mm</text>

  <!-- base -->
  <ellipse class="base" cx="280" cy="560" rx="120" ry="18"/>
  <rect class="base" x="268" y="400" width="24" height="160"/>
  <text class="n" x="300" y="480">气杆 450–550</text>

  <!-- seat -->
  <rect class="seat" x="180" y="360" width="220" height="28" rx="4"/>
  <text class="t" x="250" y="380">坐垫</text>

  <!-- arm -->
  <rect class="arm" x="150" y="300" width="70" height="18" rx="3"/>
  <rect class="arm" x="155" y="318" width="14" height="50"/>
  <text class="t" x="40" y="312">扶手 4D 纯机械</text>
  <text class="n" x="40" y="330">↑70 / 前后40 / 侧摆 / 旋转</text>
  <text class="n" x="40" y="346">无电机</text>

  <!-- back frame -->
  <path class="back" d="M380 360 L400 120"/>
  <text class="n" x="410" y="200">靠背框 ↑50</text>

  <!-- upper back (side silhouette of dual) -->
  <rect class="upper" x="395" y="130" width="55" height="110" rx="4"/>
  <text class="t" x="460" y="170">上背 L/R</text>
  <text class="n" x="460" y="188">各 ↑50 AP50 ±15°</text>
  <text class="n" x="460" y="206">分块（侧视重合）</text>

  <!-- lumbar -->
  <rect class="lumb" x="390" y="250" width="60" height="70" rx="4"/>
  <text class="t" x="460" y="280">腰靠滑架</text>
  <text class="n" x="460" y="298">↑50 AP50 ±15°</text>
  <text class="n" x="460" y="316">传感 · Stretch∥Track互斥</text>

  <!-- headrest -->
  <rect class="seat" x="400" y="70" width="70" height="36" rx="4"/>
  <text class="t" x="490" y="90">头枕</text>
  <text class="n" x="490" y="108">↑80 · 前后 TBD</text>

  <!-- pivot O -->
  <circle cx="380" cy="360" r="6" fill="#111"/>
  <text class="t" x="300" y="355">O 倾仰枢轴</text>

  <!-- lumbar-seat dim -->
  <path class="dim" d="M390 320 H520"/>
  <text class="n" x="530" y="324">腰–坐外缘距 ≈420 · 间隙 ≈30</text>

  <text class="n" x="28" y="600">示意比例非 CAD。修改要点：扶手纯机械；上背左右分块（正视图见本页图4）。</text>
</svg>
