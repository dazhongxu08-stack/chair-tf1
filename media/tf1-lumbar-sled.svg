<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <title>TF-1 lumbar</title>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#333"/>
    </marker>
    <style>
      .f { fill: none; stroke: #1a1a1a; stroke-width: 2; }
      .p { fill: #e8eef5; stroke: #1a3a5c; stroke-width: 1.8; }
      .m { fill: #f0f0f0; stroke: #333; stroke-width: 1.4; }
      .act { fill: #dde8dd; stroke: #2a5a2a; stroke-width: 1.5; }
      .d { stroke: #444; stroke-width: 1; fill: none; }
      .t { font: 13px sans-serif; fill: #222; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
      .h { font: 600 16px sans-serif; fill: #111; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
      .n { font: 12px sans-serif; fill: #555; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    </style>
  </defs>
  <text class="h" x="24" y="30">图2  腰靠滑架机构简图（侧视剖切）</text>
  <text class="n" x="24" y="52">单位 mm · 轨距 s≈120【假设】· 悬臂见标注</text>

  <rect class="m" x="80" y="90" width="28" height="360"/>
  <text class="t" x="55" y="80">靠背框挂板</text>
  <text class="t" x="22" y="180" transform="rotate(-90 22 180)">框升降 ↑50</text>

  <rect class="m" x="108" y="170" width="50" height="200"/>
  <text class="t" x="115" y="260">升降</text>
  <text class="t" x="115" y="278">滑座</text>

  <rect class="act" x="118" y="110" width="30" height="55"/>
  <text class="t" x="155" y="140">升降推杆 ≥100 N</text>
  <line class="d" x1="170" y1="170" x2="170" y2="370"/>
  <line class="d" x1="164" y1="170" x2="176" y2="170"/>
  <line class="d" x1="164" y1="370" x2="176" y2="370"/>
  <text class="t" x="182" y="275">行程 50</text>

  <line class="f" x1="163" y1="190" x2="163" y2="350"/>
  <text class="t" x="90" y="420">轨距 s≈120【假设】</text>

  <rect class="m" x="168" y="220" width="90" height="100"/>
  <text class="t" x="185" y="275">AP 滑台</text>

  <rect class="act" x="175" y="195" width="120" height="22"/>
  <text class="t" x="305" y="210">AP 丝杠推杆 · 行程 50 · 额定 ≥300 N</text>

  <circle cx="270" cy="270" r="6" fill="#1a1a1a"/>
  <text class="t" x="248" y="302">节距铰 P</text>
  <text class="t" x="255" y="320">±15°</text>

  <rect class="p" x="276" y="210" width="24" height="120"/>
  <rect class="p" x="300" y="205" width="40" height="130" rx="6"/>
  <text class="t" x="355" y="260">软垫 + 传感</text>
  <text class="t" x="355" y="280">硬背板 480×240</text>

  <line class="d" x1="365" y1="205" x2="365" y2="335"/>
  <line class="d" x1="359" y1="205" x2="371" y2="205"/>
  <line class="d" x1="359" y1="335" x2="371" y2="335"/>
  <text class="t" x="378" y="275">240</text>

  <line class="d" x1="340" y1="270" x2="420" y2="270" marker-end="url(#arr)"/>
  <text class="t" x="400" y="258">Fc</text>
  <text class="n" x="385" y="295">Track 40/80/120 N</text>
  <text class="n" x="385" y="313">Stretch 力帽 180 N【假设】</text>

  <line class="d" x1="270" y1="270" x2="270" y2="240"/>
  <text class="t" x="220" y="230">e≈30【假设】</text>
  <line class="d" x1="163" y1="380" x2="310" y2="380"/>
  <text class="t" x="185" y="400">悬臂 Lc≈80（AP 全伸）【假设】</text>

  <path class="f" d="M300 205 L330 180" stroke-dasharray="4 3"/>
  <path class="f" d="M300 335 L330 360" stroke-dasharray="4 3"/>
  <text class="t" x="335" y="185">+15°</text>
  <text class="t" x="335" y="365">−15°</text>

  <text class="n" x="530" y="130">零件要点</text>
  <text class="n" x="530" y="155">1 框挂板 / 竖向导轨</text>
  <text class="n" x="530" y="178">2 升降滑座 + 自锁推杆</text>
  <text class="n" x="530" y="201">3 双直线导轨（抗偏载）</text>
  <text class="n" x="530" y="224">4 AP 梯形丝杠模组</text>
  <text class="n" x="530" y="247">5 节距铰 + 硬限位 ±15°</text>
  <text class="n" x="530" y="270">6 硬背板 + 压力条带 2–4 区</text>
  <text class="n" x="530" y="293">7 软垫（不承担主推力）</text>
  <text class="n" x="530" y="330">控制：Track 与 Stretch 互斥</text>
  <text class="n" x="530" y="353">倾仰 &gt;130° 降增益；160° 持位</text>
</svg>
